<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#16191D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Strength">
<title>Strength plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16191D;
  --road:#FFD100;
  --paper:#EEF1F3;
  --card:#FFFFFF;
  --line:#CBD3D9;
  --muted:#46525C;
  --go:#17703A;
  --focus:#0B57D0;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:400 19px/1.55 var(--body);padding-bottom:env(safe-area-inset-bottom)}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
button{font:inherit;color:inherit}

/* Header: ink bar with a dashed road line underneath */
.top{background:var(--ink);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between}
.top h1{font:700 28px/1 var(--display);margin:0;letter-spacing:.02em}
.guidelink{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border:2px solid #fff;border-radius:10px;background:transparent;cursor:pointer;font-weight:700;font-size:17px;color:#fff}
.guidelink[aria-current="page"]{background:var(--road);border-color:var(--road);color:var(--ink)}
.roadline{height:8px;background:repeating-linear-gradient(90deg,var(--road) 0 30px,var(--ink) 30px 48px)}

/* Day strip */
.strip{position:sticky;top:0;z-index:10;background:var(--ink);padding:10px 8px 12px;border-bottom:1px solid #000}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;max-width:640px;margin:0 auto}
.daytab{position:relative;display:flex;align-items:center;justify-content:center;min-height:52px;padding:0;border:0;border-radius:10px;background:#2A3037;color:#fff;cursor:pointer;font-weight:700;font-size:16px}
.daytab[aria-current="page"]{background:var(--road);color:var(--ink)}
.daytab.today::after{content:"";position:absolute;bottom:5px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:currentColor}

main{max-width:640px;margin:0 auto;padding:16px 16px 48px}
.dayname{font:700 46px/1 var(--display);margin:0 0 4px;letter-spacing:.01em}
.focus{font-size:22px;font-weight:700;margin:0;line-height:1.3}
.time{display:block;font-size:17px;font-weight:400;color:var(--muted)}
.intro{margin:8px 0 14px;font-size:17px;color:var(--muted);line-height:1.45}

.phase{margin:0 0 6px}
.phase label{display:block;font-weight:700;font-size:17px;margin-bottom:4px}
.phase select{width:100%;min-height:52px;padding:0 14px;font:inherit;font-size:19px;background:#fff;border:2px solid var(--ink);border-radius:10px;color:var(--ink)}

.note{background:var(--card);border:1px solid var(--line);border-left:8px solid var(--road);border-radius:10px;padding:12px 14px;margin:0 0 14px}
.note strong{display:block}

.prog{display:flex;justify-content:space-between;margin:12px 0 6px;font-weight:700;font-size:17px}
.bar{height:10px;background:#D7DEE3;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--go);transition:width .25s}

.ex{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:12px 0;overflow:hidden}
.ex.is-done{border-color:var(--go)}
.exhead{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 10px}
.check{flex:none;width:54px;height:54px;border-radius:50%;border:3px solid var(--ink);background:#fff;display:grid;place-items:center;cursor:pointer;padding:0}
.check svg{width:30px;height:30px;stroke:#fff;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.check[aria-pressed="true"]{background:var(--go);border-color:var(--go)}
.check[aria-pressed="true"] svg{opacity:1}
.exbtn{flex:1;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;background:none;border:0;padding:6px 0;min-height:56px;cursor:pointer}
.exname{display:block;font:700 28px/1.05 var(--display)}
.exdose{display:block;font-size:18px;color:var(--muted);margin-top:2px}
.chev{flex:none;width:14px;height:14px;border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(45deg);margin:0 6px 4px 0;transition:transform .2s}
.exbtn[aria-expanded="true"] .chev{transform:rotate(-135deg);margin-bottom:-4px}
.is-done .exname{color:var(--go)}
.info .exhead{padding-left:16px}
.info .exname{font-size:24px}
.info p{margin:8px 0 0}

.exbody{padding:4px 16px 18px}
.exbody[hidden]{display:none}
.kit{background:#FFF6BF;border-left:6px solid var(--road);border-radius:6px;padding:10px 12px;margin:8px 0 14px}
.exbody ol{margin:0 0 14px;padding-left:1.3em}
.exbody li{margin:0 0 6px}
.watch{margin:0 0 16px}

.vid{position:relative;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden}
.vid img,.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:cover}
.play{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;cursor:pointer;padding:0}
.play::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.28)}
.play span{position:absolute;left:50%;top:50%;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;background:var(--road)}
.play span::after{content:"";position:absolute;left:29px;top:22px;border-left:26px solid var(--ink);border-top:16px solid transparent;border-bottom:16px solid transparent}
.vidmeta{margin:8px 0 0;font-size:17px;color:var(--muted)}
.vidmeta a{font-weight:700;color:var(--ink);white-space:nowrap}

.guide h3{font:700 30px/1.1 var(--display);margin:28px 0 6px}
.guide h3:first-of-type{margin-top:8px}
.guide p{margin:0 0 10px}
.phases{list-style:none;margin:0;padding:0}
.phases li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:0 0 8px}
.phases b{display:block}
.fine{margin-top:32px;font-size:16px;color:var(--muted)}

@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.bar i,.chev{transition:none}}
@media (min-width:600px){body{font-size:20px}.dayname{font-size:60px}}
</style>
</head>
<body>

  <h1>Strength plan</h1>

<nav class="strip" aria-label="Days of the week"><div class="days" id="days"></div></nav>
<main id="main"></main>

  function renderNav(active) {
    var today = todayKey();
    daysEl.innerHTML = DAYS.map(function (d) {
      var cls = "daytab" + (d.key === today ? " today" : "");
      var cur = d.key === active ? ' aria-current="page"' : "";
      var label = d.name + (d.key === today ? " (today)" : "");
      return '<button type="button" class="' + cls + '" data-route="' + d.key + '"' + cur + ' aria-label="' + label + '">' + d.short + "</button>";
    }).join("");
    if (active === "guide") guideLink.setAttribute("aria-current", "page");
    else guideLink.removeAttribute("aria-current");
  }

  function videoHTML(v) {
    var thumb = "https://i.ytimg.com/vi/" + v.id + "/hqdefault.jpg";
    return '<div class="vid" data-id="' + v.id + '">' +
      '<button class="play" data-act="play" aria-label="Play video: ' + v.title + '">' +
      '<img src="' + thumb + '" alt="" loading="lazy"><span></span></button></div>' +
      '<p class="vidmeta">' + v.title + '. <a href="https://www.youtube.com/watch?v=' + v.id + '" target="_blank" rel="noopener">Open in YouTube</a></p>';
  }

  function cardHTML(day, item) {
    var ex = EX[item.id];
    var k = keyOf(day, item.id);
    var isDone = !!done[k];
    var isOpen = !!opened[k];
    return '<article class="ex' + (isDone ? " is-done" : "") + '" data-k="' + k + '">' +
      '<div class="exhead">' +
        '<button class="check" data-act="check" aria-pressed="' + isDone + '" aria-label="Done: ' + ex.name + '">' + TICK + "</button>" +
        '<button class="exbtn" data-act="toggle" aria-expanded="' + isOpen + '">' +
          '<span><span class="exname">' + ex.name + '</span><span class="exdose">' + doseFor(ex, item.dose) + '</span></span>' +
          '<span class="chev" aria-hidden="true"></span>' +
        "</button>" +
      "</div>" +
      '<div class="exbody"' + (isOpen ? "" : " hidden") + ">" +
        '<p class="kit"><strong>You need:</strong> ' + ex.kit + "</p>" +
        "<ol>" + ex.steps.map(function (s) { return "<li>" + s + "</li>"; }).join("") + "</ol>" +
        '<p class="watch"><strong>Watch for:</strong> ' + ex.watch + "</p>" +
        videoHTML(ex.video) +
      "</div></article>";
  }

  function infoHTML(id, title, text) {
    var isOpen = !!opened[id];
    return '<article class="ex info" data-k="' + id + '"><div class="exhead">' +
      '<button class="exbtn" data-act="toggle" aria-expanded="' + isOpen + '">' +
      '<span><span class="exname">' + title + '</span></span><span class="chev" aria-hidden="true"></span></button></div>' +
      '<div class="exbody"' + (isOpen ? "" : " hidden") + "><p>" + text + "</p></div></article>";
  }

  function dayHTML(day) {
    var items = day.ex.map(normal);
    var h = '<h2 class="dayname">' + day.name + '</h2>' +
      '<p class="focus">' + day.focus + '<span class="time">' + day.time + '</span></p>' +
      '<p class="intro">' + day.intro + '</p>';

    if (items.length) {
      h += '<div class="phase"><label for="phase">Where are you up to?</label><select id="phase">' +
        PHASES.map(function (p, i) {
          return '<option value="' + i + '"' + (i === phase ? " selected" : "") + ">" + p.label + ": " + p.name + "</option>";
        }).join("") + "</select></div>";
      h += '<div class="prog"><span id="progtext"></span></div><div class="bar" aria-hidden="true"><i id="progbar"></i></div>';
      if (day.strength) h += infoHTML("warm-" + day.key, "Warm up, 3 minutes", WARM);
      h += items.map(function (it) { return cardHTML(day, it); }).join("");
      if (day.strength) h += infoHTML("cool-" + day.key, "When you finish", COOL);
    } else {
      h += '<p class="note"><strong>Today</strong>Walk the dog as normal, eat well, and put your feet up. Tomorrow is Monday: legs and core.</p>';
    }
    return h;
  }

  function guideHTML() {
    var h = '<div class="guide"><h2 class="dayname">Guide</h2><p class="focus">Worth reading once</p>';
    GUIDE.forEach(function (g) { h += "<h3>" + g[0] + "</h3><p>" + g[1] + "</p>"; });
    h += "<h3>The eight weeks</h3><ul class=\"phases\">" +
      PHASES.map(function (p) { return "<li><b>" + p.label + ": " + p.name + "</b>" + p.text + "</li>"; }).join("") + "</ul>";
    h += '<p class="fine">This plan is general guidance, not medical advice. Check with your GP if you are unsure about anything. Videos are hosted on YouTube and belong to their creators.</p></div>';
    return h;
  }

  function validRoute(r) {
    if (r === "guide") return r;
    for (var i = 0; i < DAYS.length; i++) if (DAYS[i].key === r) return r;
    return null;
  }
  var route = validRoute((location.hash || "").replace("#", "")) || todayKey();
  function currentDay() { return route; }

  function updateProgress() {
    var key = currentDay();
    var day = DAYS.filter(function (d) { return d.key === key; })[0];
    var t = document.getElementById("progtext");
    var b = document.getElementById("progbar");
    if (!day || !t || !b) return;
    var items = day.ex.map(normal);
    var n = items.filter(function (it) { return done[keyOf(day, it.id)]; }).length;
    t.textContent = n === items.length ? "All done. Well done." : n + " of " + items.length + " done";
    b.style.width = (items.length ? (n / items.length) * 100 : 0) + "%";
  }

  function render(scrollTop) {
    var key = currentDay();
    renderNav(key);
    if (key === "guide") main.innerHTML = guideHTML();
    else main.innerHTML = dayHTML(DAYS.filter(function (d) { return d.key === key; })[0]);
    updateProgress();
    if (scrollTop) window.scrollTo(0, 0);
  }

  /* ---------- Events ---------- */

  main.addEventListener("click", function (e) {
    var btn = e.target.closest("[data-act]");
    if (!btn) return;
    var card = btn.closest(".ex");
    var act = btn.getAttribute("data-act");

    if (act === "toggle" && card) {
      var body = card.querySelector(".exbody");
      var open = btn.getAttribute("aria-expanded") !== "true";
      btn.setAttribute("aria-expanded", open);
      body.hidden = !open;
      opened[card.getAttribute("data-k")] = open;
    } else if (act === "check" && card) {
      var k = card.getAttribute("data-k");
      var on = btn.getAttribute("aria-pressed") !== "true";
      btn.setAttribute("aria-pressed", on);
      card.classList.toggle("is-done", on);
      if (on) done[k] = 1; else delete done[k];
      store.set("sp-done", done);
      updateProgress();
    } else if (act === "play") {
      var box = btn.closest(".vid");
      var id = box.getAttribute("data-id");
      box.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + id +
        '?autoplay=1&rel=0&playsinline=1&modestbranding=1" title="Exercise video" ' +
        'allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>';
    }
  });

  main.addEventListener("change", function (e) {
    if (e.target.id === "phase") {
      phase = parseInt(e.target.value, 10) || 0;
      store.set("sp-phase", phase);
      render(false);
    }
  });

  function go(r) {
    if (!validRoute(r)) return;
    route = r;
    try { history.replaceState(null, "", "#" + r); } catch (e) {}
    render(true);
  }
  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-route]");
    if (b) go(b.getAttribute("data-route"));
  });
  window.addEventListener("hashchange", function () {
    var r = validRoute((location.hash || "").replace("#", ""));
    if (r && r !== route) { route = r; render(true); }
  });
  render(false);
})();
</script>
</body>
</html>
